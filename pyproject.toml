[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "homewizard-cloud"
dynamic = ["version"]
description = "Async Python library for the HomeWizard Cloud API (P1 meter over WebSocket)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
authors = [
    {name = "Mauro Druwel"}
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["homewizard", "p1", "meter", "cloud", "websocket", "energy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.28",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/maurodruwel/homewizard-cloud"
Repository = "https://github.com/maurodruwel/homewizard-cloud"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "homewizard_cloud.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM", "RET", "C4", "PERF", "PYI", "RSE", "FLY", "ARG", "RUF", "T20"]
ignore = ["T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PERF203"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
